name: Yayınla (web + APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: yayinla
  cancel-in-progress: false

jobs:
  web:
    name: Web sayfasını yayınla
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: APK derle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace

      - name: Sürümü oku
        id: ver
        run: echo "version=$(jq -r .version web/version.json)" >> "$GITHUB_OUTPUT"

      - name: APK dosyasını adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk ders-takvimim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ders-takvimim-${{ steps.ver.outputs.version }}
          path: ders-takvimim.apk

      - name: Sürüm (Release) oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Ders Takvimim ${{ steps.ver.outputs.version }}
          body_path: web/version.json
          files: ders-takvimim.apk
          make_latest: true
          overwrite_files: true
